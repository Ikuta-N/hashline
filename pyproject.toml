[project]
name = "hashline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ikuta-N", email = "t.ikuta.naoki@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
hashline = "hashline:main"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
markers = ["slow: requires downloading an embedding model"]
addopts = "-m 'not slow'"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

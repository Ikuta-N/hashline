<article class="note" id="note-{{ note.id }}" style="margin-left: {{ indent * 20 if indent * 20 <= 200 else 200 }}px">
  <p>{{ note.body }}</p>
  <div class="meta">
    {{ note.created_at.strftime('%Y-%m-%d %H:%M') }}
    {% if tag_names %} · {{ tag_names | join(', ') }}{% endif %}
    {% if note.citekey %} · {{ note.citekey }}{% if note.page %} p.{{ note.page }}{% endif %}{% endif %}
    · <button hx-get="/notes/{{ note.id }}/reply" hx-swap="afterend">reply</button>
    · <button hx-get="/notes/{{ note.id }}/thread" hx-target="#timeline" hx-swap="outerHTML">thread</button>
    · <button hx-post="/notes/{{ note.id }}/delete" hx-confirm="Are you sure you want to delete note {{ note.id }}?" hx-include="[name='q'], [name='tag'], [name='citekey'], [name='roots_only']" hx-target="#timeline" hx-swap="outerHTML">delete</button>
  </div>
</article>

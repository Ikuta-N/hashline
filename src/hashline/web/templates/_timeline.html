<section id="timeline">
  {% if notice %}
    <p class="notice" role="status">{{ notice }}</p>
  {% endif %}
  {% if error %}
    <p class="error" role="alert">
      {{ error }}
      {% if delete_retry_id %}
        <form hx-post="/notes/{{ delete_retry_id }}/delete" hx-target="#timeline" hx-swap="outerHTML" style="display:inline;">
          <input type="hidden" name="recursive" value="true">
          <input type="hidden" name="q" value="{{ q }}">
          <input type="hidden" name="tag" value="{{ tag }}">
          <button type="submit">delete the whole thread</button>
        </form>
      {% endif %}
    </p>
  {% endif %}
  {% for note, tag_names, indent in notes %}
    {% include "_note.html" %}
  {% else %}
    <p class="empty">{% if q %}no matches{% else %}no notes yet{% endif %}</p>
  {% endfor %}
</section>

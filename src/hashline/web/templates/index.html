{% extends "base.html" %}
{% block content %}
  {% include "_context.html" %}

  <form class="composer"
        hx-post="/notes"
        hx-target="#timeline"
        hx-swap="outerHTML"
        hx-on::after-request="this.reset()">
    <input type="hidden" name="q" value="{{ q }}">
    <input type="hidden" name="tag" value="{{ tag }}">
    <input type="hidden" name="citekey" value="{{ citekey }}">
    <input type="hidden" name="roots_only" value="{{ 'true' if roots_only else '' }}">
    <input type="text" name="body" placeholder="一行で。#タグ もそのまま書く" autofocus>
    <input type="text" name="tags" placeholder="tags">
    {% if pinned_citekey %}
      <input type="text" name="page" placeholder="page">
    {% endif %}
    <label><input type="checkbox" name="no_context"> no_context</label>
    <button type="submit">add</button>
  </form>

  <form class="composer" role="search" id="search-form">
    <!-- search ignores citekey and roots_only; disable the toggle when searching to make this clear -->
    <input type="text" name="q" value="{{ q }}" placeholder="検索"
           oninput="this.form.roots_only.disabled = !!this.value.trim()"
           hx-get="/notes"
           hx-target="#timeline"
           hx-swap="outerHTML"
           hx-trigger="input changed delay:250ms, search"
           hx-include="[name='tag'], [name='citekey'], [name='roots_only']">
    <input type="hidden" name="tag" value="{{ tag }}">
    <input type="hidden" name="citekey" value="{{ citekey }}">
    <label title="Search ignores roots_only">
      <input type="checkbox" name="roots_only" value="true" {% if roots_only %}checked{% endif %} {% if q %}disabled{% endif %}
             hx-get="/notes"
             hx-target="#timeline"
             hx-swap="outerHTML"
             hx-include="[name='q'], [name='tag'], [name='citekey']">
      hide replies
    </label>
  </form>

  {% if citekey %}
  <nav class="citekey-filter">
    <!-- search ignores citekey; the chip remains but its filter effect is inert while q is set -->
    <a href="/?{% if tag %}tag={{ tag | urlencode }}{% endif %}{% if q %}&q={{ q | urlencode }}{% endif %}{% if roots_only %}&roots_only={{ roots_only }}{% endif %}" class="on">citekey: {{ citekey }} ✕</a>
  </nav>
  {% endif %}

  <nav class="tags">
    <a href="/?{% if q %}q={{ q | urlencode }}&{% endif %}{% if citekey %}citekey={{ citekey | urlencode }}&{% endif %}{% if roots_only %}roots_only=true{% endif %}" class="{{ 'on' if not tag }}">all</a>
    {% for entry in tags %}
      <a href="/?tag={{ entry.name | urlencode }}{% if q %}&q={{ q | urlencode }}{% endif %}{% if citekey %}&citekey={{ citekey | urlencode }}{% endif %}{% if roots_only %}&roots_only=true{% endif %}"
         class="{{ 'on' if entry.name == tag }}">#{{ entry.name }} {{ entry.count }}</a>
    {% endfor %}
  </nav>

  {% include "_timeline.html" %}
{% endblock %}

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hashline</title>
<script src="{{ url_for('static', path='htmx.min.js') }}"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1d1d1f; --muted: #6b6b70;
    --line: #e3e3e0; --card: #ffffff; --accent: #2f6f4f; --danger: #a33a2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --fg: #ececee; --muted: #9a9aa2;
      --line: #2c2c33; --card: #1e1e23; --accent: #7fc4a0; --danger: #e39184;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  .count { color: var(--muted); font-size: .85rem; }
  form.composer { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  input[type=text] {
    flex: 1; padding: .6rem .75rem; font: inherit; color: var(--fg);
    background: var(--card); border: 1px solid var(--line); border-radius: .5rem;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: .6rem 1rem; font: inherit; cursor: pointer; color: var(--bg);
    background: var(--accent); border: 0; border-radius: .5rem;
  }
  .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.25rem; }
  .tags a {
    padding: .15rem .6rem; font-size: .8rem; text-decoration: none;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 1rem;
  }
  .tags a.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .note {
    padding: .75rem .9rem; margin-bottom: .5rem; background: var(--card);
    border: 1px solid var(--line); border-radius: .5rem;
  }
  .note p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { margin-top: .35rem; font-size: .78rem; color: var(--muted); }
  .empty { padding: 2rem 0; color: var(--muted); text-align: center; }
  .error {
    margin: 0 0 .75rem; padding: .6rem .9rem; font-size: .9rem;
    color: var(--danger); background: var(--card);
    border: 1px solid var(--danger); border-radius: .5rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>hashline</h1>
    <span class="count">{{ total }} notes</span>
  </header>

  <form class="composer"
        hx-post="/notes"
        hx-target="#timeline"
        hx-swap="outerHTML"
        hx-on::after-request="this.reset()">
    <input type="text" name="body" placeholder="一行で。#タグ もそのまま書く" autofocus>
    <input type="hidden" name="tag" value="{{ tag }}">
    <button type="submit">add</button>
  </form>

  <form class="composer" role="search">
    <input type="text" name="q" value="{{ q }}" placeholder="検索"
           hx-get="/notes"
           hx-target="#timeline"
           hx-swap="outerHTML"
           hx-trigger="input changed delay:250ms, search"
           hx-include="[name='tag']">
    <input type="hidden" name="tag" value="{{ tag }}">
  </form>

  <nav class="tags">
    <a href="/{% if q %}?q={{ q | urlencode }}{% endif %}" class="{{ 'on' if not tag }}">all</a>
    {% for entry in tags %}
      <a href="/?tag={{ entry.name | urlencode }}{% if q %}&q={{ q | urlencode }}{% endif %}"
         class="{{ 'on' if entry.name == tag }}">#{{ entry.name }} {{ entry.count }}</a>
    {% endfor %}
  </nav>

  {% include "_timeline.html" %}
</div>
</body>
</html>
